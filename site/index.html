<!doctype html>
<html lang="nan-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="台語齒盤社群辭典：腔口差、新詞，佮辭典猶未收的詞。">
  <title>台語齒盤社群辭典</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="台語齒盤社群辭典">
  <meta property="og:title" content="台語齒盤社群辭典">
  <meta property="og:description" content="腔口差、新詞，佮辭典猶未收的詞。">
  <meta property="og:url" content="https://taigikeyboard.tw/community-dictionary/">
  <meta property="og:locale" content="zh_TW">
  <script>
    // apply the display settings and sidebar state before first paint (site/settings.js, site/sidebar.js)
    try {
      const root = document.documentElement;
      if (JSON.parse(localStorage.getItem("sidebar")) === "open") root.dataset.sidebar = "open";
      const settings = JSON.parse(localStorage.getItem("settings")) || {};
      for (const [name, value] of Object.entries(settings)) {
        if (typeof value === "string") root.dataset[name] = value;
      }
    } catch {}
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="site/app.js"></script>
</head>
<body>
  <button class="corner-button sidebar-toggle" type="button" aria-controls="sidebar" aria-label="側邊欄" title="側邊欄">
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <rect x="2.75" y="4" width="14.5" height="12" rx="2.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M7.75 4v12" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </svg>
  </button>
  <!-- left sidebar: docked on wide screens (site/sidebar.js slides it away); on narrow ones a popover,
       so outside click / Esc close it -->
  <aside id="sidebar" class="sidebar" popover aria-label="側邊欄">
    <div class="sidebar-close">
      <button class="corner-button" type="button" popovertarget="sidebar" popovertargetaction="hide" aria-label="關" title="關">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <!-- the markup's selected / checked values are the defaults (site/settings.js) -->
    <form id="settings" aria-label="設定">
      <label class="setting">外觀
        <select name="theme">
          <option value="auto" selected>自動</option>
          <option value="light">淺色</option>
          <option value="dark">暗色</option>
        </select>
      </label>
      <label class="setting">字型
        <select name="font">
          <option value="system">系統</option>
          <option value="openhuninn">粉圓</option>
          <option value="iansui" selected>芫荽</option>
          <option value="genyomin">源樣明體</option>
          <option value="genyogothic">源樣烏體</option>
        </select>
      </label>
      <div class="settings-heading">選單顯示</div>
      <label class="setting">白話字
        <input type="checkbox" name="poj" role="switch" checked>
      </label>
      <label class="setting">方音符號
        <input type="checkbox" name="tps" role="switch" checked>
      </label>
    </form>
  </aside>
  <main id="view">
    <noscript>這个網站愛開 JavaScript 才會當用。</noscript>
  </main>

  <footer class="footer">
    <a href="https://github.com/taigikeyboard/community-dictionary" rel="noopener" aria-label="GitHub" title="GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </footer>
</body>
</html>
